services:
  neo4j:
    image: neo4j:5-community
    container_name: neo4j-kg-demo
    ports:
      - "7474:7474"   # browser UI: http://localhost:7474
      - "7687:7687"   # bolt protocol
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_PLUGINS=[]
    volumes:
      - neo4j_kg_demo_data:/data

volumes:
  neo4j_kg_demo_data:
